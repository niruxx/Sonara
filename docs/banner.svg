<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Sonara</title>
  <desc id="desc">Sonara: a beautiful, self-hosted music player for your own library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="28"/></clipPath>
    <style>
      .blob { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .b2 { animation-duration: 18s; animation-delay: -6s; }
      .b3 { animation-duration: 22s; animation-delay: -11s; }
      @keyframes drift { from { transform: translate(-30px, -12px) scale(1); } to { transform: translate(40px, 18px) scale(1.15); } }
      .eq rect { transform-box: fill-box; transform-origin: bottom; animation: bounce 1.6s ease-in-out infinite; }
      @keyframes bounce { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      .logo rect { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { transform: scaleY(.6); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .blob, .eq rect, .logo rect { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <ellipse class="blob" cx="260" cy="90" rx="380" ry="260" fill="url(#glowA)"/>
    <ellipse class="blob b2" cx="1060" cy="360" rx="420" ry="260" fill="url(#glowB)"/>
    <ellipse class="blob b3" cx="820" cy="40" rx="320" ry="200" fill="url(#glowC)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>

    <!-- Equalizer across the bottom -->
    <g class="eq" opacity=".5">
      <rect x="40" y="300" width="14" height="120" rx="7" fill="url(#bar)" style="animation-delay:-.1s"/>
      <rect x="64" y="270" width="14" height="150" rx="7" fill="url(#bar)" style="animation-delay:-.7s"/>
      <rect x="88" y="320" width="14" height="100" rx="7" fill="url(#bar)" style="animation-delay:-1.2s"/>
      <rect x="112" y="290" width="14" height="130" rx="7" fill="url(#bar)" style="animation-delay:-.4s"/>
      <rect x="136" y="335" width="14" height="85" rx="7" fill="url(#bar)" style="animation-delay:-.9s"/>
      <rect x="160" y="310" width="14" height="110" rx="7" fill="url(#bar)" style="animation-delay:-1.4s"/>
      <rect x="184" y="345" width="14" height="75" rx="7" fill="url(#bar)" style="animation-delay:-.2s"/>
      <rect x="1082" y="330" width="14" height="90" rx="7" fill="url(#bar2)" style="animation-delay:-.5s"/>
      <rect x="1106" y="300" width="14" height="120" rx="7" fill="url(#bar2)" style="animation-delay:-1.1s"/>
      <rect x="1130" y="275" width="14" height="145" rx="7" fill="url(#bar2)" style="animation-delay:-.3s"/>
      <rect x="1154" y="315" width="14" height="105" rx="7" fill="url(#bar2)" style="animation-delay:-.8s"/>
      <rect x="1178" y="290" width="14" height="130" rx="7" fill="url(#bar2)" style="animation-delay:-1.5s"/>
      <rect x="1202" y="335" width="14" height="85" rx="7" fill="url(#bar2)" style="animation-delay:-.6s"/>
      <rect x="1226" y="305" width="14" height="115" rx="7" fill="url(#bar2)" style="animation-delay:-1s"/>
    </g>

    <!-- Logo mark: five bars, like the app's -->
    <g class="logo" transform="translate(398 128)">
      <rect x="0" y="34" width="16" height="44" rx="8" fill="url(#bar)" style="animation-delay:-.2s"/>
      <rect x="26" y="16" width="16" height="80" rx="8" fill="url(#bar)" style="animation-delay:-.9s"/>
      <rect x="52" y="0" width="16" height="112" rx="8" fill="url(#bar)" style="animation-delay:-.5s"/>
      <rect x="78" y="22" width="16" height="68" rx="8" fill="url(#bar)" style="animation-delay:-1.3s"/>
      <rect x="104" y="40" width="16" height="32" rx="8" fill="url(#bar)" style="animation-delay:-.7s"/>
    </g>

    <text x="548" y="226" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#brand)">Sonara</text>
    <text x="640" y="296" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#e9e6f5" fill-opacity=".85">Your music, beautifully. Self-hosted, on every device.</text>
    <text x="640" y="340" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#a78bfa" fill-opacity=".9">STREAM · CAST · SYNC · DISCOVER</text>

    <rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
